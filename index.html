<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de Certificado</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef1f7;
}

.top{
    height:180px;
    background:#1f4e96;
}

.top2{
    height:180px;
    background:#1f4e96;
    margin-top:200px;
}
.card{
    max-width:500px;
    margin:-490px auto 30px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    padding:30px;
}



.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#2458a8;
    font-size:28px;
    margin-top:15px;
}
    .centro{
    text-align:center;
}

.centro img{
    max-width:100%;
    height:auto;
    display:block;
    margin:auto;
}







.success{
    background:#42b649;
    color:white;
    padding:12px;
    border-radius:8px;
    font-size:16px;
    margin-bottom:20px;
}

.item{
    margin-bottom:18px;
}

.label{
    display:inline-block;
    background:#c99632;
    color:white;
    padding:6px 15px;
    border-radius:20px;
    font-size:16px;
}

.value{
    font-size:16px;
    color:#555;
    margin-top:8px;
    border-bottom:1px solid #ddd;
    padding-bottom:8px;
}

@media(max-width:700px){

.header h1{
    font-size:28px;
}

.label{
    font-size:18px;
}

.value{
    font-size:20px;
}

.success{
    font-size:18px;
}
}
</style>

</head>
<body>

<div class="top"></div>
<div class="top2"></div>


<div class="card">

<div class="header">


<div class="header">

<div class="centro">
    <img src="https://github.com/cstc299-debug/mi-pagina-web/blob/main/M.png?raw=true" alt="Logo">
</div>


</div>


<h1>AUTÉNTICAR CERTIFICADO</h1>
</div>

<div class="success">
✔ CERTIFICADO AUTENTICADO CON LOS 
SIGUIENTES DATOS.
</div>

<div class="item">
<div class="label">Estudiante:</div>
<div class="value">DANIEL </div>
</div>

<div class="item">
<div class="label">Curso:</div>
<div class="value">EXCEL BASICO</div>
</div>

<div class="item">
<div class="label">Unidad Operativa:</div>
<div class="value">Departamento de Formación a Distancia</div>
</div>

<div class="item">
<div class="label">Modo de formación:</div>
<div class="value">Complementación a Distancia (Virtual)</div>
</div>

<div class="item">
<div class="label">Número de registro:</div>
<div class="value">2637334</div>
</div>

</div>

</body>
</html>
